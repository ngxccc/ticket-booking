name: Performance & Load Testing

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Load test suite to execute"
        required: false
        default: "booking-concurrency"
        type: choice
        options:
          - "booking-concurrency"
          - "shows-seats"
          - "all"
      strict:
        description: "Enforce strict SLA gates (abort on threshold breach)"
        required: false
        default: false
        type: boolean
      vus:
        description: "Number of concurrent Virtual Users (VUs) for booking suite"
        required: false
        default: "500"
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: K6 Concurrency Stress & Invariant Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
      DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      REDIS_URL: redis://localhost:6379
      PORT: "3000"
      TARGET_URL: "http://127.0.0.1:3000"
      VUS: ${{ github.event.inputs.vus || '2000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment
      - name: Start Test Services
        uses: ./.github/setup-services

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run Database Migrations
        run: doppler run --preserve-env="true" -c test -- bun drizzle-kit migrate --config drizzle.config.ts

      - name: Build Application
        run: bun run build

      - name: Start Application in Background
        run: |
          doppler run --preserve-env="true" -c test -- bun dist/main.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          ready=false
          for i in {1..30}; do
            if curl -s -f "$TARGET_URL/health" > /dev/null 2>&1; then
              echo "NestJS application is healthy and ready on $TARGET_URL!"
              ready=true
              break
            fi
            echo "Waiting for app readiness... ($i/30)"
            sleep 1
          done
          if [ "$ready" = false ]; then
            echo "Error: NestJS application failed to become ready within 30 seconds."
            exit 1
          fi

      - name: Execute Unified Load Test Orchestrator
        env:
          STRICT_SLA: ${{ github.event.inputs.strict || 'false' }}
          P95_THRESHOLD: ${{ (github.event.inputs.vus == '2000') && '3500' || '1500' }}
          P99_THRESHOLD: ${{ (github.event.inputs.vus == '2000') && '5000' || '2000' }}
        run: bun run test:load ${{ github.event.inputs.suite || 'booking-concurrency' }}
      - name: Upload k6 Performance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-load-test-summaries
          path: test-results/load/
          if-no-files-found: warn
