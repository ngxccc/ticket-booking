name: Code Quality, Build & Integration Tests

on:
  workflow_call:

jobs:
  integration:
    name: "Build, Lint & Test Suite"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
      DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Start Test Services
        uses: ./.github/setup-services

      - name: Database Migrations
        run: bun run db:migrate test

      - name: Unit Tests
        run: bun run test:ci

      - name: Publish Unit Test Results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "coverage/junit.xml"
          check_name: "Unit Test Suite Results"
          detailed_summary: true
          annotate_only: true
          require_tests: true

      - name: E2E Tests
        run: bun run test:e2e

      - name: Fast Linting (Oxlint)
        run: bun run lint:fast

      - name: Deep Linting (ESLint)
        run: bun run lint:eslint

      - name: Type-Checking
        run: bun run check-types

      - name: Build Application
        run: bun run build
