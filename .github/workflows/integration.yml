name: Code Quality, Build & Integration Tests

on:
  workflow_call:

jobs:
  integration:
    name: Integration Verification
    runs-on: ubuntu-latest
    environment: staging
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
      DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ticket_booking
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql,tmpfs-size=1073741824
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --mount type=tmpfs,destination=/data,tmpfs-size=536870912
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Run Linting
        run: bun run lint

      - name: Run Type-Checking
        run: bun run check-types

      - name: Run Unit Tests
        run: bun run test:cov

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Run Database Migrations
        run: doppler run --preserve-env="true" -c stg -- bun drizzle-kit migrate --config drizzle.config.ts

      - name: Build Application
        run: bun run build

      - name: Run E2E Tests
        run: doppler run --preserve-env="true" -c stg -- bun test test/
