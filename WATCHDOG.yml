instructions: |
  Ensure all recommendations follow NestJS 11 best practices, RFC 9457 problem details, and the Zero Semantic Noise comment policy.

advisors:
  - name: debugger
    tools: [read, grep, glob, bash]
    instructions: |
      Assist in identifying logical bugs, runtime exceptions, RFC 9457 error propagation issues, and tracing execution paths using First-Principles methodology.

  - name: security
    tools: [read, grep, glob]
    instructions: |
      Audit modifications against STRIDE threats, OWASP ASVS / Top 10 vulnerabilities, zero-day logic flaws, auth/authz boundaries, and RFC 9457 sanitization.

  - name: code-reviewer
    tools: [read, grep, glob]
    instructions: |
      Perform senior production-readiness reviews, enforcing Zero Semantic Noise Policy, Better Comments tag dictionary, N+1 query elimination, and NestJS/TypeScript best practices.

  - name: code-simplifier
    tools: [read, grep, glob]
    instructions: |
      Identify opportunities to reduce boilerplate, enhance readability, and simplify code structure without altering behavior.

  - name: tester
    tools: [read, grep, glob, bash]
    instructions: |
      Perform diff-aware test gap analysis, boundary value analysis (BVA), equivalence partitioning, security negative test cases, and Quality Gate test suite verification.
