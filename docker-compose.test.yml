services:
  postgres:
    image: postgres:18-alpine
    container_name: ticket-booking-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ticket_booking
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql:size=1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: ticket-booking-test-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    tmpfs:
      - /data:size=512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
